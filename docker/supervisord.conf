; app/**/*.php for ShouldQueue and routes/console.php for schedule() calls
; — none found). Add [program:queue-worker] / [program:scheduler] blocks
; here if that changes later (see anas-pos's supervisord.conf for the
; pattern: `php artisan queue:work` / `php artisan schedule:work`).
